name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-qt6:
    name: Ubuntu 24.04 / Qt 6
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6sql6-sqlite appstream desktop-file-utils clang-format

      - name: Check formatting
        run: |
          clang-format --version
          find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 -n1 clang-format --dry-run --Werror

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build failure summary
        if: failure()
        run: |
          {
            echo '### Build log'
            echo '```'
            tail -n 120 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: |
          DESTDIR="$RUNNER_TEMP/install" cmake --install build --prefix /usr
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/install/usr/bin/nutsync" --version
          desktop-file-validate "$RUNNER_TEMP/install/usr/share/applications/"*.desktop
          appstreamcli validate --no-net "$RUNNER_TEMP/install/usr/share/metainfo/"*.xml
          test -f "$RUNNER_TEMP/install/usr/share/licenses/nutsync/LICENSE"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  arch-full:
    name: Arch Linux / full KDE stack
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git python qt6-tools \
            qt6-base qt6-svg qtkeychain-qt6 \
            kstatusnotifieritem knotifications

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build failure summary
        if: failure()
        run: |
          {
            echo '### Build log'
            echo '```'
            tail -n 120 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arch-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  clang-build:
    name: Clang / Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6sql6-sqlite

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6sql6-sqlite

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  metadata:
    name: Desktop and AppStream metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/io.github.gomodb.NutSync.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate packaging/io.github.gomodb.NutSync.desktop

      - name: Check Python test helper syntax
        run: python3 -m py_compile tests/mock_webdav_server.py

  aur-package:
    name: AUR package (tag/manual)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git python fakeroot namcap sudo curl qt6-tools \
            qt6-base qt6-svg qtkeychain-qt6 \
            kstatusnotifieritem knotifications

      - name: Ensure AUR metadata
        run: |
          if [ ! -f packaging/arch/PKGBUILD ]; then
            git clone --depth 1 \
              "https://github.com/$GITHUB_REPOSITORY.git" /tmp/nutsync-source
            mkdir -p packaging
            cp -a /tmp/nutsync-source/packaging/arch packaging/arch
          fi

      - name: Verify tag matches PKGBUILD version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver="$(bash -c 'source packaging/arch/PKGBUILD; printf %s "$pkgver"')"
          if [ "$tag" != "$pkgver" ]; then
            echo "Tag $tag does not match PKGBUILD pkgver $pkgver"
            exit 1
          fi

      - name: Prepare builder
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check .SRCINFO
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          set -o pipefail
          sudo -u builder makepkg --printsrcinfo > .SRCINFO.generated 2>&1 | tee srcinfo.log
          if ! diff -u .SRCINFO .SRCINFO.generated > srcinfo.diff; then
            cat srcinfo.diff
            exit 1
          fi

      - name: Build package
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          set -o pipefail
          sudo -u builder makepkg -f --noconfirm 2>&1 | tee aur-build.log


      - name: Run namcap
        run: |
          namcap packaging/arch/PKGBUILD
          namcap packaging/arch/nutsync-[0-9]*.pkg.tar.zst

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nutsync-arch-package
          path: packaging/arch/nutsync-[0-9]*.pkg.tar.zst
          if-no-files-found: error
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: aur-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download AUR package
        uses: actions/download-artifact@v7
        with:
          name: nutsync-arch-package
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.pkg.tar.zst > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.pkg.tar.zst SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.pkg.tar.zst SHA256SUMS \
              --title "NutSync $GITHUB_REF_NAME" \
              --generate-notes
          fi
