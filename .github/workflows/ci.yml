name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-qt6:
    name: Ubuntu 24.04 / Qt 6
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 \
            qt6-base-dev libqt6sql6-sqlite

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build failure summary
        if: failure()
        run: |
          {
            echo '### Build log'
            echo '```'
            tail -n 120 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  arch-full:
    name: Arch Linux / full KDE stack
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git python \
            qt6-base qt6-svg qtkeychain-qt6 \
            kstatusnotifieritem knotifications

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build failure summary
        if: failure()
        run: |
          {
            echo '### Build log'
            echo '```'
            tail -n 120 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arch-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  metadata:
    name: Desktop and AppStream metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/io.github.nutsync.NutSync.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate packaging/io.github.nutsync.NutSync.desktop

      - name: Check Python test helper syntax
        run: python3 -m py_compile tests/mock_webdav_server.py

  aur-package:
    name: AUR package (tag/manual)
    if: true
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git python fakeroot namcap sudo curl \
            qt6-base qt6-svg qtkeychain-qt6 \
            kstatusnotifieritem knotifications

      - name: Verify tag matches PKGBUILD version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver="$(bash -c 'source packaging/arch/PKGBUILD; printf %s "$pkgver"')"
          if [ "$tag" != "$pkgver" ]; then
            echo "Tag $tag does not match PKGBUILD pkgver $pkgver"
            exit 1
          fi

      - name: Diagnose workspace
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la
          ls -la "$GITHUB_WORKSPACE" | head
          command -v runuser makepkg sudo || true

      - name: Prepare builder
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check .SRCINFO
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          set -o pipefail
          sudo -u builder makepkg --printsrcinfo > .SRCINFO.generated 2>&1 | tee srcinfo.log
          if ! diff -u .SRCINFO .SRCINFO.generated > srcinfo.diff; then
            cat srcinfo.diff
            exit 1
          fi

      - name: Build package
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          set -o pipefail
          sudo -u builder makepkg -f --noconfirm 2>&1 | tee aur-build.log

      - name: Publish AUR diagnostics
        if: failure()
        run: |
          for f in packaging/arch/srcinfo.diff packaging/arch/srcinfo.log packaging/arch/aur-build.log; do
            if [ -s "$f" ]; then
              url="$(curl -fsS --data-binary @"$f" https://paste.rs || true)"
              echo "::error title=AUR diagnostic: $f::$url"
            fi
          done

      - name: Run namcap
        run: |
          namcap packaging/arch/PKGBUILD
          namcap packaging/arch/nutsync-[0-9]*.pkg.tar.zst

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nutsync-arch-package
          path: packaging/arch/nutsync-[0-9]*.pkg.tar.zst
          if-no-files-found: error
