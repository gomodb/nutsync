name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-qt6:
    name: Ubuntu 24.04 / Qt 6
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6sql6-sqlite appstream desktop-file-utils clang-format

      - name: Check formatting
        run: |
          clang-format --version
          find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 -n1 clang-format --dry-run --Werror

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build failure summary
        if: failure()
        run: |
          {
            echo '### Build log'
            echo '```'
            tail -n 120 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: |
          DESTDIR="$RUNNER_TEMP/install" cmake --install build --prefix /usr
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/install/usr/bin/nutsync" --version
          desktop-file-validate "$RUNNER_TEMP/install/usr/share/applications/"*.desktop
          appstreamcli validate --no-net "$RUNNER_TEMP/install/usr/share/metainfo/"*.xml
          test -f "$RUNNER_TEMP/install/usr/share/licenses/nutsync/LICENSE"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  ubuntu-arm64:
    name: Ubuntu 24.04 arm64 / Qt 6
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6sql6-sqlite

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: |
          DESTDIR="$RUNNER_TEMP/install" cmake --install build --prefix /usr
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/install/usr/bin/nutsync" --version

  arch-full:
    name: Arch Linux / full KDE stack
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git python qt6-tools \
            qt6-base qt6-svg qtkeychain-qt6 \
            kstatusnotifieritem knotifications

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Build failure summary
        if: failure()
        run: |
          {
            echo '### Build log'
            echo '```'
            tail -n 120 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arch-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  arch-arm-package:
    name: Arch Linux ARM / native package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    container: menci/archlinuxarm:base-devel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Arch Linux ARM
        run: |
          set -x
          sed -i 's|^Server = http://|Server = https://|' /etc/pacman.d/mirrorlist
          sed -i 's/^#DisableSandboxFilesystem/DisableSandboxFilesystem/' /etc/pacman.conf
          sed -i 's/^#DisableSandboxSyscalls/DisableSandboxSyscalls/' /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm

      - name: Install packaging dependencies
        run: |
          pacman -S --noconfirm --needed \
            base-devel shadow util-linux cmake ninja git python \
            qt6-base qt6-svg qt6-translations qt6-tools \
            qtkeychain-qt6 kstatusnotifieritem knotifications

      - name: Build package
        run: |
          useradd -m builder
          rm -rf /tmp/nutsync-src
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            https://github.com/gomodb/nutsync.git /tmp/nutsync-src
          chown -R builder:builder /tmp/nutsync-src
          runuser -u builder -- bash -c \
            "cd /tmp/nutsync-src/packaging/arch && exec makepkg --noconfirm --force"

      - name: Install and smoke test
        run: |
          package="$(find /tmp/nutsync-src/packaging/arch -maxdepth 1 -name 'nutsync-*.pkg.tar.*' | head -n1)"
          test -n "$package"
          pacman -U --noconfirm "$package"
          QT_QPA_PLATFORM=offscreen nutsync --version
          test -f /usr/share/applications/io.github.gomodb.NutSync.desktop
          test -f /usr/share/metainfo/io.github.gomodb.NutSync.metainfo.xml

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nutsync-archlinuxarm
          path: /tmp/nutsync-src/packaging/arch/nutsync-*.pkg.tar.*
          if-no-files-found: error

  clang-build:
    name: Clang / Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6sql6-sqlite

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6sql6-sqlite

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  metadata:
    name: Desktop and AppStream metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/io.github.gomodb.NutSync.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate packaging/io.github.gomodb.NutSync.desktop

      - name: Check Python test helper syntax
        run: python3 -m py_compile tests/mock_webdav_server.py

  arch-package:
    name: Arch Linux package (tag/manual)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja git python fakeroot namcap sudo curl qt6-tools \
            qt6-base qt6-svg qt6-translations qtkeychain-qt6 \
            kstatusnotifieritem knotifications \
            appstream desktop-file-utils

      - name: Verify tag matches PKGBUILD version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver="$(bash -c 'source packaging/arch/PKGBUILD; printf %s "$pkgver"')"
          if [ "$tag" != "$pkgver" ]; then
            echo "Tag $tag does not match PKGBUILD pkgver $pkgver"
            exit 1
          fi

      - name: Prepare builder
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          set -o pipefail
          sudo -u builder makepkg -f --noconfirm 2>&1 | tee arch-build.log


      - name: Install package smoke test
        run: |
          package="$(find packaging/arch -maxdepth 1 -name 'nutsync-[0-9]*.pkg.tar.zst' | head -n1)"
          test -n "$package"
          pacman -U --noconfirm "$package"
          QT_QPA_PLATFORM=offscreen nutsync --version
          desktop-file-validate /usr/share/applications/io.github.gomodb.NutSync.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.gomodb.NutSync.metainfo.xml

      - name: Run namcap
        run: |
          set -o pipefail
          namcap packaging/arch/PKGBUILD | tee namcap-pkgbuild.log
          namcap packaging/arch/nutsync-[0-9]*.pkg.tar.zst | tee namcap-package.log
          if grep -Eq '(^|[[:space:]])E: ' namcap-pkgbuild.log namcap-package.log; then
            echo "namcap reported errors"
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nutsync-arch-package
          path: packaging/arch/nutsync-[0-9]*.pkg.tar.zst
          if-no-files-found: error
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch-package, arch-arm-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download x86_64 package
        uses: actions/download-artifact@v7
        with:
          name: nutsync-arch-package
          path: dist

      - name: Download aarch64 package
        uses: actions/download-artifact@v7
        with:
          name: nutsync-archlinuxarm
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.pkg.tar.* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.pkg.tar.* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.pkg.tar.* SHA256SUMS \
              --title "NutSync $GITHUB_REF_NAME" \
              --generate-notes
          fi
