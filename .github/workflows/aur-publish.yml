name: Publish to AUR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.4.2)
        required: true
        default: v0.4.6

permissions:
  contents: read

jobs:
  publish:
    name: Publish AUR package
    runs-on: ubuntu-24.04
    environment: aur
    steps:
      - name: Checkout packaging
        uses: actions/checkout@v7

      - name: Validate tag and package metadata
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$TAG"
          pkgver="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          pkgrel="$(sed -n 's/^pkgrel=//p' packaging/arch/PKGBUILD)"
          test "${TAG#v}" = "$pkgver" || {
            echo "Tag $TAG does not match PKGBUILD pkgver $pkgver"
            exit 1
          }
          test -s packaging/arch/.SRCINFO
          test -f packaging/arch/LICENSE
          echo "Preparing $pkgver-$pkgrel"

      - name: Configure AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY" || {
            echo "AUR_SSH_PRIVATE_KEY is not configured"
            exit 1
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<'SSH'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          SSH
          chmod 600 "$HOME/.ssh/config"

      - name: Check out or initialize AUR repository
        run: |
          if git clone ssh://aur@aur.archlinux.org/nutsync.git aur-repo; then
            echo "Cloned existing AUR repository"
          else
            mkdir -p aur-repo
            git -C aur-repo init
            git -C aur-repo checkout -b master
            git -C aur-repo remote add origin ssh://aur@aur.archlinux.org/nutsync.git
          fi

      - name: Commit package metadata
        run: |
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO packaging/arch/LICENSE aur-repo/
          cd aur-repo
          git config user.name "NutSync Release Bot"
          git config user.email "release@nut-sync.invalid"
          git add PKGBUILD .SRCINFO LICENSE
          if git diff --cached --quiet; then
            echo "AUR metadata is already up to date"
            exit 0
          fi
          git commit -m "nutsync $(sed -n 's/^pkgver=//p' PKGBUILD)-$(sed -n 's/^pkgrel=//p' PKGBUILD)"
          git push origin master
