name: Arch Linux ARM package

on:
  workflow_dispatch:
  push:
    tags:
      - 'arm-test-*'

permissions:
  contents: read

jobs:
  package:
    name: Arch Linux ARM / native aarch64 package
    runs-on: ubuntu-24.04-arm
    container: menci/archlinuxarm:base-devel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Arch Linux ARM
        run: |
          set +e
          uname -m
          sed -i 's|^Server = http://|Server = https://|' /etc/pacman.d/mirrorlist
          sed -i 's/^#DisableSandboxFilesystem/DisableSandboxFilesystem/' /etc/pacman.conf
          sed -i 's/^#DisableSandboxSyscalls/DisableSandboxSyscalls/' /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm > /tmp/syu.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 15 /tmp/syu.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Install packaging dependencies
        run: |
          set -x
          pacman -S --noconfirm --needed \
            base-devel shadow util-linux cmake ninja git python \
            qt6-base qt6-svg qt6-translations qt6-tools \
            qtkeychain-qt6 kstatusnotifieritem knotifications

      - name: Build package
        run: |
          set +e
          useradd -m builder
          rm -rf /tmp/nutsync-build
          cp -a "$PWD" /tmp/nutsync-build
          chown -R builder:builder /tmp/nutsync-build
          echo "::notice::pwd=$PWD"
          ls -ld "$PWD" /tmp/nutsync-build /tmp/nutsync-build/packaging /tmp/nutsync-build/packaging/arch 2>&1 | while IFS= read -r line; do echo "::notice::$line"; done
          runuser -u builder -- bash -c "ls -ld /tmp/nutsync-build; cd /tmp/nutsync-build/packaging/arch && exec makepkg --noconfirm --force" > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Install and smoke test
        run: |
          package="$(find /tmp/nutsync-build/packaging/arch -maxdepth 1 -name 'nutsync-[0-9]*.pkg.tar.zst' | head -n1)"
          test -n "$package"
          pacman -U --noconfirm "$package"
          QT_QPA_PLATFORM=offscreen nutsync --version
          test -f /usr/share/applications/io.github.gomodb.NutSync.desktop
          test -f /usr/share/metainfo/io.github.gomodb.NutSync.metainfo.xml

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nutsync-archlinuxarm
          path: /tmp/nutsync-build/packaging/arch/nutsync-*.pkg.tar.zst
          if-no-files-found: error
