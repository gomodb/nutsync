name: Arch Linux ARM package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Arch Linux ARM / native aarch64 package
    runs-on: ubuntu-24.04-arm
    container: menci/archlinuxarm:base-devel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Arch Linux ARM
        run: |
          set +e
          uname -m
          sed -i 's|^Server = http://|Server = https://|' /etc/pacman.d/mirrorlist
          sed -i 's/^#DisableSandboxFilesystem/DisableSandboxFilesystem/' /etc/pacman.conf
          sed -i 's/^#DisableSandboxSyscalls/DisableSandboxSyscalls/' /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm > /tmp/syu.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 15 /tmp/syu.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Install packaging dependencies
        run: |
          set -x
          pacman -S --noconfirm --needed \
            base-devel shadow util-linux cmake ninja git python \
            qt6-base qt6-svg qt6-translations qt6-tools \
            qtkeychain-qt6 kstatusnotifieritem knotifications

      - name: Build package
        run: |
          set +e
          useradd -m builder
          rm -rf /tmp/nutsync-src
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" https://github.com/gomodb/nutsync.git /tmp/nutsync-src
          chown -R builder:builder /tmp/nutsync-src
          runuser -u builder -- bash -c "cd /tmp/nutsync-src/packaging/arch && exec makepkg --noconfirm --force" > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Install and smoke test
        run: |
          set +e
          package="$(find /tmp/nutsync-src -maxdepth 4 -type f -name 'nutsync-*.pkg.tar.*' | head -n1)"
          echo "::notice::package=$package"
          test -n "$package" || { echo "::error::package missing"; exit 1; }
          pacman -U --noconfirm "$package" > /tmp/install.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 30 /tmp/install.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$status"
          fi
          QT_QPA_PLATFORM=offscreen nutsync --version
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::nutsync --version failed with $status"
            ldd "$(command -v nutsync)" | while IFS= read -r line; do echo "::notice::$line"; done
            exit "$status"
          fi
          test -f /usr/share/applications/io.github.gomodb.NutSync.desktop
          test -f /usr/share/metainfo/io.github.gomodb.NutSync.metainfo.xml

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nutsync-archlinuxarm
          path: /tmp/nutsync-src/packaging/arch/nutsync-*.pkg.tar.*
          if-no-files-found: error
